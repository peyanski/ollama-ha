name: "Ollama-HA"
slug: "ollama-ha"
version: "0.3.6"
description: "Run Ollama LLM server locally on your Home Assistant instance."
url: "https://github.com/peyanski/ollama-ha"
startup: services
init: false
image: ghcr.io/peyanski/{arch}-ollama-ha
arch:
  - amd64
  - aarch64
ports:
  11434/tcp: 11434
host_network: true
panel_icon: mdi:brain
video: true

options:
  gpu: false
  start_auth: false
  integrated_gpu: false
  context_length: 2048
  flash_attention: false
  kv_cache_type: f16
  keep_alive: 5m
schema:
  gpu: bool
  start_auth: bool
  integrated_gpu: bool?
  context_length: int(1,)?
  flash_attention: bool?
  kv_cache_type: list(f16|q8_0|q4_0)?
  keep_alive: str?

environment:
  HOME: "/data"
  OLLAMA_HOST: "0.0.0.0:11434"
  OLLAMA_CONTEXT_LENGTH: "2048"
  OLLAMA_NUM_PARALLEL: "1"
  OLLAMA_MAX_LOADED_MODELS: "1"

map:
  - share:rw
